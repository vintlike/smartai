server:
  port: ${SMARTAI_SERVER_PORT:8090}

spring:
  datasource:
    # 本地默认值保持不变，部署时通过环境变量覆盖，避免凭证写死在仓库里
    url: jdbc:mysql://${SMARTAI_DB_HOST:localhost}:${SMARTAI_DB_PORT:3306}/${SMARTAI_DB_NAME:smartai}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${SMARTAI_DB_USERNAME:root}
    password: ${SMARTAI_DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: smartai-pool
      # 对话与训练链路存在秒级长请求，池太小会让后续请求直接排队到超时
      maximum-pool-size: ${SMARTAI_DB_POOL_MAX:20}
      minimum-idle: 5
      connection-timeout: 10000
      validation-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1500000

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.smartai.entity
  configuration:
    map-underscore-to-camel-case: true
    # 走 slf4j 而不是 StdOutImpl：SQL 日志由日志级别控制，可按需关闭且不绕过日志框架
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

smartai:
  auth:
    # 令牌签名密钥：默认值仅供本地演示，部署时必须用 SMARTAI_AUTH_SECRET 覆盖
    secret: ${SMARTAI_AUTH_SECRET:6c82af21563b517a034036095e9801d00c41e71ccd99b8cf3ea34d9bf08cae3d}
    # 令牌有效期（分钟），过期后接口返回 401，前端自动回到登录页
    expire-minutes: ${SMARTAI_AUTH_EXPIRE_MINUTES:720}

logging:
  charset:
    # Windows 终端默认按 GBK(936) 解码，Spring Boot 3 控制台日志默认 UTF-8 会显示成「鏈嶅姟」这类乱码
    console: ${SMARTAI_LOG_CHARSET:GBK}
  level:
    root: INFO
    com.smartai: INFO
    # 需要看完整 SQL 时把 SMARTAI_SQL_LOG_LEVEL 设为 DEBUG
    com.smartai.mapper: ${SMARTAI_SQL_LOG_LEVEL:INFO}
