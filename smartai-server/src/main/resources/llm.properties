# ===================== VUA AI 网关配置（llm 包专用） =====================
# 优先级：JVM 系统属性（-Dllm.xxx） > 本文件 > 内置默认值

# 网关分发的虚拟 key（真实密钥不入仓库，由部署环境注入）
llm.apiKey=<REDACTED>

# 网关域名：办公网 https://vua-ai-gateway.vmic.xyz ；预发/正式内网 http://vua-ai-gateway.vivo.lan:8080
llm.baseUrl=https://vua-ai-gateway.vmic.xyz

# 默认模型，可用清单见 LlmModel：DeepSeek-V4-Flash-auto / Doubao-Seed-2.1-pro / Doubao-Seed-2.0-mini 等
llm.defaultModel=DeepSeek-V4-Flash-auto

# 客户端并发上限（网关对未走支出评估单应用默认 QPS<=3），0 或负数表示不限制
llm.maxConcurrency=3
